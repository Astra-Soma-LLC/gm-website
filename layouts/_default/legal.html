{{ define "main" }}
{{ partial "components/page-title.html" . }}
<section class="section pt-0">
  <div class="container">
    <div class="row">
      <div class="col-md-10 m-auto">
        <div class="content legal-content">
          {{ .Content }}
        </div>
      </div>
    </div>
  </div>
</section>
<style>
  /* Heading sizes for legal pages */
  .legal-content h1 { font-size: 28px; font-weight: 600; }
  .legal-content h2 { font-size: 22px; font-weight: 600; }
  .legal-content h3 { font-size: 18px; font-weight: 600; }
  .legal-content h4 { font-size: 16px; font-weight: 600; }

  /* Table styles */
  .legal-content table {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    width: 100%;
    border-collapse: collapse;
    margin: 1.5rem 0;
  }
  .legal-content table th {
    background: #f5f5f5;
    color: #333;
    font-weight: 600;
    padding: 10px 14px;
    border: 1px solid #ddd;
    font-size: 14px;
    min-width: 120px;
  }
  .legal-content table td {
    background: #fff;
    color: #333;
    padding: 10px 14px;
    border: 1px solid #ddd;
    font-size: 14px;
    min-width: 120px;
    white-space: normal;
  }
  .legal-content table tr:nth-child(even) td {
    background: #fafafa;
  }
</style>
{{ end }}
