{{ define "main" }}
{{ partial "components/page-title.html" . }}

<section class="section bg-gray">
	<div class="container">
		<div class="row">
			<div class="col-lg-12">
				<div class="text-center section-title">
					<h2>{{ i18n "posted_by" }}</h2>
				</div>
			</div>
			{{ range where .Site.RegularPages "Params.author" (.Title | title) }}
			{{ .Render "post" }}
			{{ end }}
		</div>
	</div>
</section>
{{ end }}
